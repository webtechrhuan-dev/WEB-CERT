name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, improvements/system-hardening]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh working branch before lockfile generation
        if: github.event_name == 'push' && github.ref_name == 'improvements/system-hardening'
        run: |
          git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: Regenerate npm lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile on branch pushes
        if: github.event_name == 'push' && github.ref_name == 'improvements/system-hardening'
        run: |
          git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git reset --mixed "origin/${GITHUB_REF_NAME}"
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sincroniza package-lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/web_cert
          AUTH_SECRET: ci-only-secret-not-used-for-authentication-123456
